<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Thyrocare – Phlebotomist Screening</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fc 0%, #e9eef5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            max-width: 650px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
            padding: 2rem 1.8rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .sub {
            color: #4a627a;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            display: inline-block;
            padding-bottom: 0.4rem;
            width: 100%;
        }
        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        input, select {
            flex: 2;
            min-width: 200px;
            padding: 14px 16px;
            font-size: 1rem;
            border: 2px solid #cfdfed;
            border-radius: 60px;
            outline: none;
            background: #fefefe;
        }
        input:focus, select:focus {
            border-color: #2b6a9e;
            box-shadow: 0 0 0 3px rgba(43,106,158,0.2);
        }
        button {
            background: #1e5a88;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            min-width: 140px;
        }
        button:hover { background: #0f4166; transform: scale(0.98); }
        .result {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 48px;
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
        }
        .eligible { background: #e0f2e9; color: #1e6f3f; border-left: 5px solid #2b8c5e; }
        .not-eligible { background: #ffe6e5; color: #b13e3e; border-left: 5px solid #d9534f; }
        .nearby { background: #fff3e0; color: #b45f1b; border-left: 5px solid #f0ad4e; }
        .contact-line {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c5a7a;
            background: rgba(0,0,0,0.02);
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
        }
        .opportunity-card, .screening-form {
            background: #fef9e6;
            border-radius: 28px;
            padding: 1.2rem;
            margin-top: 1.2rem;
            text-align: left;
            border: 1px solid #ffe0a3;
        }
        .screening-form { background: #f0f7ff; border-color: #cce0f5; }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #1a3a5c;
        }
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .form-row .form-group { flex: 1; }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: middle;
            accent-color: #1e5a88;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 8px;
        }
        .checkbox-group label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .error {
            color: #c7254e;
            background: #f9e6e8;
            padding: 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            margin-top: 8px;
            text-align: center;
        }
        .stats {
            font-size: 0.75rem;
            color: #6c86a3;
            margin-top: 1.5rem;
            background: #f0f4fa;
            padding: 0.7rem;
            border-radius: 40px;
            text-align: center;
        }
        .thankyou {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 24px;
            margin-top: 1rem;
            text-align: center;
        }
        .note {
            font-size: 0.8rem;
            color: #b45f1b;
            background: #fff3e0;
            padding: 10px;
            border-radius: 20px;
            margin-top: 12px;
            text-align: center;
        }
        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #8ba0b9;
        }
        .example {
            font-size: 0.8rem;
            background: #f8fafd;
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            margin-top: 10px;
        }
        @media (max-width: 480px) {
            .card { padding: 1.2rem; }
            h1 { font-size: 1.5rem; }
            button { padding: 12px 20px; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🩸 Thyrocare Phlebotomist Hiring</h1>
    <div class="sub">Check eligibility & apply online</div>

    <div class="input-group">
        <input type="text" id="pincodeInput" placeholder="Enter 6-digit pincode" maxlength="6" inputmode="numeric">
        <button id="checkBtn">🔍 Check & Apply</button>
    </div>
    <div id="errorMsg" class="error" style="display: none;"></div>

    <div id="resultDisplay" class="result"></div>
    <div id="dynamicContent"></div>

    <div class="example">📌 Example: 521228, 624004, 403001</div>
    <div class="stats" id="statsInfo">Loading active locations...</div>
    <footer>✅ After eligibility, fill the screening form to apply</footer>
</div>

<script>
    // ==================== PINCODE DATA FROM YOUR GIST ====================
    let exactSet = new Set();
    let prefix5Set = new Set();
    let pincodesLoaded = false;

    async function loadPincodes() {
        const statsDiv = document.getElementById('statsInfo');
        statsDiv.innerHTML = '📡 Loading pincodes from server...';
        try {
            const GIST_URL = 'https://gist.githubusercontent.com/secondmedicofficial-byte/7174ab643430eb6af710de761bdd24f5/raw/pincodes.json';
            const response = await fetch(GIST_URL);
            if (!response.ok) throw new Error('Failed to fetch pincodes');
            const pincodes = await response.json();
            exactSet = new Set(pincodes);
            for (let p of pincodes) {
                if (p.length >= 5) prefix5Set.add(p.substring(0,5));
            }
            pincodesLoaded = true;
            statsDiv.innerHTML = `📍 ${exactSet.size} active locations loaded | 5‑digit nearby matching enabled`;
        } catch (err) {
            console.error(err);
            statsDiv.innerHTML = '⚠️ Failed to load pincodes. Please refresh or try again later.';
        }
    }

    loadPincodes();
    // =====================================================================

    const inputEl = document.getElementById('pincodeInput');
    inputEl.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0,6);
        document.getElementById('errorMsg').style.display = 'none';
    });

    const contactHTML = `<div class="contact-line">📞 Contact hiring manager: Sandhya – 9004931558</div>`;
    const opportunityHTML = `
        <div class="opportunity-card">
            <h3>🌟 Opportunity – Home Blood Sample Collection with Second Medic (Thyrocare) 🌟</h3>
            <ul>
                <li><strong>Role:</strong> Phlebotomist</li>
                <li><strong>Experience Required:</strong> Minimum 1 year using Vacutainer Needle Holder</li>
                <li><strong>📍 Location:</strong> Nearest to your PIN code</li>
                <li><strong>⏰ Timing:</strong> 6:00 AM – 11:00 AM</li>
                <li><strong>💼 Job Type:</strong> Part-time</li>
                <li><strong>💰 Salary:</strong> Performance incentive ₹600-1000/month + up to 20% add-on incentive</li>
                <li><strong>📱 Requirements:</strong> Bike/Scooter, Refrigerator, Centrifuge, Android phone (BTech & GPS Camera app)</li>
            </ul>
            <div class="note">📌 Please note – We pay order-wise payout, no fixed salary.</div>
        </div>
    `;

    const screeningFormHTML = `
        <div class="screening-form" id="screeningFormContainer">
            <h3>📝 Apply for this position</h3>
            <form id="candidateForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="fullName" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number (10 digits) *</label>
                        <input type="tel" id="phone" maxlength="10" inputmode="numeric" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Years of Phlebotomy Experience *</label>
                        <input type="number" step="0.5" id="experience" required>
                    </div>
                    <div class="form-group">
                        <label>Vacutainer Experience? *</label>
                        <select id="vacutainerExp" required>
                            <option value="">Select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Qualification *</label>
                    <select id="qualification" required>
                        <option value="">Select</option>
                        <option value="DMLT">DMLT</option>
                        <option value="MLT">MLT</option>
                        <option value="GNM">GNM</option>
                        <option value="BSC(MLT)">BSC(MLT)</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Equipment you own (can select multiple):</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="Bike/Scooter"> Bike/Scooter</label>
                        <label><input type="checkbox" value="Refrigerator"> Refrigerator</label>
                        <label><input type="checkbox" value="Centrifuge"> Centrifuge</label>
                        <label><input type="checkbox" value="Android phone"> Android phone</label>
                    </div>
                </div>
                <input type="hidden" id="submittedPincode" value="">
                <button type="submit" id="submitBtn">✅ Submit Application</button>
                <div class="note" style="margin-top: 12px;">📌 We pay you order wise, not fixed salary.</div>
            </form>
            <div id="formStatus" style="margin-top: 12px;"></div>
        </div>
    `;

    function showScreeningForm(pincode) {
        const dynamicDiv = document.getElementById('dynamicContent');
        dynamicDiv.innerHTML = screeningFormHTML;
        document.getElementById('submittedPincode').value = pincode;
        attachFormSubmit();
        const phoneInput = document.getElementById('phone');
        if (phoneInput) {
            phoneInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0,10);
            });
        }
    }

    // ✅ CORRECTED fetch without 'no-cors'
    function attachFormSubmit() {
        const form = document.getElementById('candidateForm');
        if (!form) return;
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            const name = document.getElementById('fullName').value.trim();
            let phone = document.getElementById('phone').value.trim();
            const experience = document.getElementById('experience').value;
            const vacutainerExp = document.getElementById('vacutainerExp').value;
            const qualification = document.getElementById('qualification').value;
            const equipment = Array.from(document.querySelectorAll('#candidateForm input[type="checkbox"]:checked')).map(cb => cb.value).join(', ');
            const pincode = document.getElementById('submittedPincode').value;

            if (phone.length !== 10) {
                document.getElementById('formStatus').innerHTML = '<div class="error">Phone number must be exactly 10 digits.</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Submit Application';
                return;
            }
            if (!name || !phone || !experience || !vacutainerExp || !qualification) {
                document.getElementById('formStatus').innerHTML = '<div class="error">Please fill all required fields.</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Submit Application';
                return;
            }

            const formData = {
                timestamp: new Date().toISOString(),
                pincode: pincode,
                name: name,
                phone: phone,
                experience_years: experience,
                vacutainer_experience: vacutainerExp,
                qualification: qualification,
                equipment: equipment
            };

            const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxOt1OXB7aQsmaMYPYpapd2CKAxtQkkKRPWbfa_I_luIRBe38rLIGl9t9sI64hy0qaJ/exec";

            try {
                // ✅ Removed mode: 'no-cors' and added proper response handling
                const response = await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status}`);
                }

                const result = await response.text();
                console.log("Server response:", result);

                // If successful, redirect to WhatsApp
                const waMessage = `🩸 *New Phlebotomist Application*%0A%0A*Name:* ${encodeURIComponent(name)}%0A*Phone:* ${phone}%0A*Pincode:* ${pincode}%0A*Experience:* ${experience} years%0A*Vacutainer:* ${vacutainerExp}%0A*Qualification:* ${qualification}%0A*Equipment:* ${encodeURIComponent(equipment) || "None"}`;
                const waLink = `https://wa.me/919004931558?text=${waMessage}`;
                window.location.href = waLink;

                document.getElementById('formStatus').innerHTML = '<div class="thankyou">✅ Application submitted! Redirecting to WhatsApp...</div>';
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('formStatus').innerHTML = '<div class="error">Submission failed. Please try again or contact Sandhya directly.</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = '✅ Submit Application';
            }
        });
    }

    function checkPincode() {
        if (!pincodesLoaded) {
            document.getElementById('resultDisplay').innerHTML = '<div class="result not-eligible">⏳ Loading pincodes, please wait...</div>';
            return;
        }
        let rawInput = inputEl.value.trim();
        const errorDiv = document.getElementById('errorMsg');
        const resultDiv = document.getElementById('resultDisplay');
        const dynamicDiv = document.getElementById('dynamicContent');

        if (rawInput === "") {
            errorDiv.textContent = "Enter a pincode";
            errorDiv.style.display = "block";
            resultDiv.innerHTML = '';
            dynamicDiv.innerHTML = '';
            return;
        }
        if (rawInput.length !== 6) {
            errorDiv.textContent = "Pincode must be 6 digits";
            errorDiv.style.display = "block";
            resultDiv.innerHTML = '';
            dynamicDiv.innerHTML = '';
            return;
        }
        errorDiv.style.display = "none";
        const pincode = rawInput;
        if (exactSet.has(pincode)) {
            resultDiv.innerHTML = `<div class="result eligible">✅ Eligible – We are hiring in ${pincode}<br>${contactHTML}</div>`;
            dynamicDiv.innerHTML = opportunityHTML;
            showScreeningForm(pincode);
        } else if (prefix5Set.has(pincode.substring(0,5))) {
            const first5 = pincode.substring(0,5);
            resultDiv.innerHTML = `<div class="result nearby">📍 Not eligible in ${pincode}, but we have openings nearby (first 5 digits: ${first5}XX).<br>${contactHTML}</div>`;
            dynamicDiv.innerHTML = opportunityHTML;
            showScreeningForm(pincode);
        } else {
            resultDiv.innerHTML = `<div class="result not-eligible">❌ We are not hiring in ${pincode}</div>`;
            dynamicDiv.innerHTML = '';
        }
    }

    document.getElementById('checkBtn').addEventListener('click', checkPincode);
    inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPincode(); });
</script>
</body>
</html>
